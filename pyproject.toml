[project]
name = "mycelium-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
authors = [
    { name = "nsadras", email = "nitin.sadras@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycelium"]

[tool.pytest.ini_options]
markers = [
    "integration: slow or external-resource integration tests",
]

[dependency-groups]
benchmark = [
    "datasets>=5.0.0",
    "nltk>=3.9.4",
    "numpy>=2.4.6",
    "rouge-score>=0.1.2",
    "tqdm>=4.68.1",
]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.15.12",
]
engram = [
    "faster-whisper>=1.2.1",
    "numpy>=2.0",
    "pyannote.audio>=4.0.5",
    "torch>=2.4",
    "whisperx>=3.8.6",
]
