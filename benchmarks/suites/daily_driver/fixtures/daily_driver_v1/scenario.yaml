    occurred_at: 2026-09-08T15:00:00-07:00
    dream_after: false
    participants: [User, Priya Raman, Luis Ortega]
    metadata:
      title: Lantern prototype planning
    segments:
      - id: meeting-02-s01
        speaker: User
        text: The prototype is now called Lantern, and it is a local desktop app for searchable meeting memory.
        retention: claim
      - id: meeting-02-s02
        speaker: Luis Ortega
        text: I will implement the local transcription pipeline and package WhisperX.
        retention: claim
      - id: meeting-02-s03
        speaker: Priya Raman
        text: I will write the pilot evaluation rubric and recruit the teams.
        retention: claim
      - id: meeting-02-s04
        speaker: User
        text: The pilot should measure correction effort and whether users can trace a memory back to the transcript.
        retention: claim
      - id: meeting-02-s05
        speaker: Luis Ortega
        text: We can have a packaged build by Friday.
        retention: claim
      - id: meeting-02-s06
        speaker: User
        text: Let us target the first pilot for September 22.
        retention: claim
