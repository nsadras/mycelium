[project]
name = "mycelium-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nsadras", email = "nitin.sadras@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10",
    "fastapi>=0.136.1",
    "gitpython>=3.1",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mycelium"]

[dependency-groups]
benchmark = [
    "datasets>=5.0.0",
    "nltk>=3.9.4",
    "numpy>=2.4.6",
    "rouge-score>=0.1.2",
    "tqdm>=4.68.1",
]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.15.12",
]
