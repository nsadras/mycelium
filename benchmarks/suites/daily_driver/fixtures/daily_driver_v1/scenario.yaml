episodes:
  - id: chat-01
    source_id: src-chat-01
    source_type: agent_conversation
    occurred_at: 2026-09-01T09:00:00-07:00
    dream_after: false
    participants: [User, Assistant]
    segments:
      - id: chat-01-s01
        speaker: User
        role: user
        text: I am a product designer in Oakland, and I want to prototype a private meeting-memory assistant that runs locally.
        retention: claim
      - id: chat-01-s02
        speaker: Assistant
        role: assistant
        text: A browser extension could make the first prototype quick to distribute and test.
        retention: source_only
      - id: chat-01-s03
        speaker: User
        role: user
        text: I do not want a browser extension. I want a desktop app because meetings include sensitive client information. I am not ready to name it yet.
        retention: claim
    actions_after: [checkpoint:cp1_pre_dream, dream, checkpoint:cp2_first_dream]

  - id: chat-02
    source_id: src-chat-02
    source_type: agent_conversation
    occurred_at: 2026-09-02T14:00:00-07:00
    dream_after: false
    participants: [User, Assistant]
    segments:
      - id: chat-02-s01
        speaker: User
        role: user
        text: For the meeting idea, recordings and transcripts must stay on the laptop. Cloud transcription is a nonstarter.
        retention: claim
      - id: chat-02-s02
        speaker: Assistant
        role: assistant
        text: A local Whisper model would satisfy that constraint.
        retention: source_only
      - id: chat-02-s03
        speaker: User
        role: user
        text: Yes, use a local Whisper model for the prototype.
        retention: claim

  - id: meeting-01
    source_id: src-meeting-01
    source_type: meeting_transcript
    occurred_at: 2026-09-03T10:00:00-07:00
    dream_after: false
    participants: [User, Priya Raman]
    metadata:
      title: Meeting-memory concept review
    segments:
      - id: meeting-01-s01
        speaker: Priya Raman
        text: I can lead evaluation for the meeting assistant and recruit three pilot teams.
        retention: claim
      - id: meeting-01-s02
        speaker: User
        text: Great. I will own the desktop prototype and consent flow.
        retention: claim
      - id: meeting-01-s03
        speaker: Priya Raman
        text: We should test speaker correction because diarization errors are inevitable.
        retention: claim
      - id: meeting-01-s04
        speaker: User
        text: Agreed. Speaker correction is required for the pilot.
        retention: claim
      - id: meeting-01-s05
        speaker: User
        text: Let us review a working prototype next Thursday.
        retention: claim

