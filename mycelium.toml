[llm]
model = "gemma4:12b"
url = "http://localhost:11434"
temperature = 1.0
top_p = 0.95
top_k = 64
timeout_seconds = 900
context_window_tokens = 65536
reasoning_enabled = true
reasoning_output_tokens = 32768
# Keep reasoning and final JSON in one generation; Pydantic still validates it.
reasoning_format = "prompt"

[session]
context_budget_tokens = 32768

[retrieval]
embedding_model = "embeddinggemma:latest"
candidate_limit = 20
initial_result_limit = 5
tool_result_limit = 6
tool_search_limit = 3
tool_evidence_budget_tokens = 6000

[engram]
store_path = "./mycelium_store/engram"
audio_dir = "./mycelium_store/engram/audio"

[engram.whisper]
model = "large-v3"
device = "auto"
compute_type = "auto"
batch_size = 8

[engram.diarization]
model = "pyannote/speaker-diarization-community-1"

[engram.summary]
model = "gemma4:12b"
url = "http://localhost:11434"
temperature = 1.0
