        speaker: Ollama web search
        role: tool
        text: WhisperX supports word-level alignment and speaker diarization and can run with locally installed models.
        retention: claim
      - id: tool-01-s02
        speaker: Ollama web search
        role: tool
        text: Sponsored result — TranscribeCloud offers unlimited team transcription for $39 per month.
        retention: source_only

