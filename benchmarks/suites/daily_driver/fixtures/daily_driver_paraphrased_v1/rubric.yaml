schema_version: 1
scenario_id: daily-driver-paraphrased-v1
principles: [Evaluate IDs and provenance rather than matching fixture wording.]
acceptance:
  milestone: page_structure_and_entity_relationships
  dimensions: [provenance_accuracy, entity_precision_recall, entity_type_accuracy, ownership_accuracy, section_accuracy, page_projection_accuracy, wiki_concision]
dimensions:
  - {id: claim_recall, stage: encoding, measure: Atomic proposition recall., severity: high}
  - {id: provenance_accuracy, stage: encoding, measure: Exact evidence retention., severity: critical, target: 1.0}
  - {id: entity_precision_recall, stage: discovery, measure: Required entities without extras., severity: high, target: 1.0}
  - {id: entity_type_accuracy, stage: discovery, measure: Correct page types., severity: high, target: 1.0}
  - {id: ownership_accuracy, stage: organization, measure: Correct canonical owner., severity: critical, target: 0.9}
  - {id: section_accuracy, stage: projection, measure: Correct typed section., severity: medium, target: 0.8}
  - {id: page_projection_accuracy, stage: projection, measure: Available source-grounded facts render at their required page and section., severity: high, target: 0.8}
  - {id: wiki_concision, stage: projection, measure: No undeclared duplicate facts., severity: medium, target: 0.0}
  - {id: retrieval_fact_recall, stage: retrieval, measure: Probe facts retrieved., severity: high}
  - {id: semantic_answer_quality, stage: answering, measure: Probe propositions answered., severity: high}
gates:
  - {id: no_premature_project, rule: The unnamed effort has no Project page after one episode., check: {type: checkpoint_checks, checkpoint: cp2_first_dream, kinds: [forbidden_page]}}
  - {id: distinct_people_and_project, rule: Hearth and Tariq remain distinct entities., check: {type: distinct_entities, checkpoint: cp3_final, entity_ids: [project-hearth, person-tariq-bell]}}
deferred_gates:
  - {id: short_term_available, milestone: retrieval, rule: Both requirements are queryable before Dream., check: {type: probe, probe_id: q-short-term, requirements: [retrieval, answer]}}
reporting: {required_outputs: [per_dimension_metrics, checkpoint_diffs, ownership_confusion_matrix, duplicate_rendered_facts, retrieval_required_and_forbidden_fact_ids, qualitative_page_diff]}
